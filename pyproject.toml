[project]
name = "agent-regression-lab"
version = "0.1.0"
description = "Tiny regression tests for AI agent traces, tool calls, and final answers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pranjal Bhatia" }]
keywords = ["ai-agents", "evals", "testing", "regression", "tool-calling"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.scripts]
arl = "agent_regression_lab.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_regression_lab"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
